name: "ctxtax"
description: "Enforce an MCP context-token budget on PRs and post a budget-diff comment."
branding:
  icon: "bar-chart-2"
  color: "yellow"

inputs:
  config:
    description: "Path to .mcp.json"
    default: ".mcp.json"
  model:
    description: "Model to count/price against"
    default: "claude-opus-4-8"
  max-tokens:
    description: "Fail the check if the total context tax exceeds this many tokens"
    default: ""
  baseline:
    description: "Committed snapshot filename to diff the PR against (compared to the base ref's copy)"
    default: ".ctxtax.json"
  anthropic-api-key:
    description: "ANTHROPIC_API_KEY for exact counts (free count_tokens). Omit for a labeled estimate."
    required: false
  comment:
    description: "Post/update a PR comment with the budget diff"
    default: "true"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install ctxtax
      shell: bash
      run: npm install -g ctxtax@latest

    - name: Fetch base budget snapshot
      id: base
      shell: bash
      run: |
        if [ -n "${{ github.base_ref }}" ]; then
          git fetch origin "${{ github.base_ref }}" --depth=1 || true
          if git show "origin/${{ github.base_ref }}:${{ inputs.baseline }}" > .ctxtax.base.json 2>/dev/null; then
            echo "have=1" >> "$GITHUB_OUTPUT"
          else
            echo "have=0" >> "$GITHUB_OUTPUT"
          fi
        else
          echo "have=0" >> "$GITHUB_OUTPUT"
        fi

    - name: Run ctxtax ci
      id: run
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
      run: |
        ARGS="--config ${{ inputs.config }} --model ${{ inputs.model }} --comment ctxtax-comment.md --summary"
        if [ -n "${{ inputs.max-tokens }}" ]; then ARGS="$ARGS --max-tokens ${{ inputs.max-tokens }}"; fi
        if [ "${{ steps.base.outputs.have }}" = "1" ]; then ARGS="$ARGS --baseline .ctxtax.base.json"; fi
        ctxtax ci $ARGS
      continue-on-error: true

    - name: Post PR comment
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          if (!fs.existsSync('ctxtax-comment.md')) return;
          const body = fs.readFileSync('ctxtax-comment.md', 'utf8');
          const marker = '<!-- ctxtax -->';
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
          const existing = comments.find((c) => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - name: Enforce gate
      shell: bash
      run: |
        if [ "${{ steps.run.outcome }}" = "failure" ]; then
          echo "ctxtax: context budget exceeded."
          exit 1
        fi
